# GoReleaser builds the release binaries. Division of labor with the rest
# of the release automation: release-please cuts the tag, the GitHub
# release, and the notes; the containers workflow builds multi-arch
# images; the release workflow publishes the Helm chart. GoReleaser only
# attaches cross-platform binary archives and checksums to the release
# release-please already created.
#
# yamlfmt: ignore
---
version: 2

builds:
  - id: polylane-k8s
    main: ./cmd/polylane-k8s
    binary: polylane-k8s
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/coreplanelabs/polylane-k8s/internal/buildinfo.Version={{.Version}}
      - -X github.com/coreplanelabs/polylane-k8s/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/coreplanelabs/polylane-k8s/internal/buildinfo.BuildTime={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: polylane-k8s
    formats: [tar.gz]
    name_template: "polylane-k8s_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - config.example.yaml

checksum:
  name_template: checksums.txt

# Keyless cosign signature over checksums.txt: one blob signature covers
# every archive (each is pinned by its checksum). cosign is hermit-pinned;
# the workflow grants id-token:write for the OIDC identity.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature
      - ${signature}
      - --output-certificate
      - ${certificate}
      - ${artifact}
    artifacts: checksum

changelog:
  # release-please owns the release notes.
  disable: true

release:
  # Attach artifacts to the release release-please created; never touch
  # its notes.
  mode: keep-existing
