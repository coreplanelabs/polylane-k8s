apiVersion: v2
name: polylane-k8s
description: >-
  Polylane's in-cluster Kubernetes agent: a read-only kube-API shim behind an
  outbound-only Cloudflare Tunnel. No inbound exposure, no exec, no watch, and
  the RBAC can never read a Secret.
type: application
version: 0.2.0
appVersion: 0.2.0
kubeVersion: '>=1.29.0-0'
home: https://github.com/coreplanelabs/polylane-k8s
sources:
  - https://github.com/coreplanelabs/polylane-k8s
