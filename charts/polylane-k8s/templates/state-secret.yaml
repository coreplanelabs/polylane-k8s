---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polylane-k8s.stateSecretName" . }}
  labels:
    {{- include "polylane-k8s.labels" . | nindent 4 }}
type: Opaque
# No data on purpose: the agent fills it in after registering (its RBAC is
# get/update/patch — never create, so the Secret must pre-exist). Helm
# never writes data keys here, so upgrades cannot clobber what the agent
# persisted.
