{{- if .Values.metrics.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "polylane-k8s.fullname" . }}-metrics
  labels:
    {{- include "polylane-k8s.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "polylane-k8s.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
{{- end }}
