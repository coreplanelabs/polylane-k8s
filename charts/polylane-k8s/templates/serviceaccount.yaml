{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "polylane-k8s.serviceAccountName" . }}
  labels:
    {{- include "polylane-k8s.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The deployment mounts a short-lived projected token explicitly; nothing
# gets a token implicitly.
automountServiceAccountToken: false
{{- end }}
