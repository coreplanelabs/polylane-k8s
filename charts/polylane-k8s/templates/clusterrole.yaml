{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "polylane-k8s.fullname" . }}
  labels:
    {{- include "polylane-k8s.labels" . | nindent 4 }}
# Enumerated read-only grants: get and list, nothing else — no watch, no
# wildcards. Credential-bearing resource types are deliberately absent
# from every rule (test/chart enforces it), so the platform cannot read
# one even if the shim's own policy were somehow bypassed.
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - nodes
      - nodes/status
      - namespaces
      - services
      - endpoints
      - events
      - configmaps
      - serviceaccounts
      - persistentvolumes
      - persistentvolumeclaims
      - replicationcontrollers
      - limitranges
      - resourcequotas
    verbs: [get, list]
  - apiGroups: [apps]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      - controllerrevisions
    verbs: [get, list]
  - apiGroups: [batch]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources:
      - ingresses
      - networkpolicies
      - ingressclasses
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list]
  - apiGroups: [policy]
    resources:
      - poddisruptionbudgets
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources:
      - storageclasses
      - csinodes
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources:
      - pods
      - nodes
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources:
      - events
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources:
      - customresourcedefinitions
    verbs: [get, list]
{{- end }}
