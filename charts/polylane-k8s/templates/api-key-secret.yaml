{{- if .Values.polylane.apiKey }}
---
# Convenience path only: prefer apiKey.existingSecret so the key never
# touches Helm release storage.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polylane-k8s.fullname" . }}-api-key
  labels:
    {{- include "polylane-k8s.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKey.secretKey }}: {{ .Values.polylane.apiKey | quote }}
{{- end }}
