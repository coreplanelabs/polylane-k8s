# Buildkite port of .github/workflows/release.yaml.
#
# The push-to-main trigger lives in the Buildkite pipeline settings.
# Credentials come from 1Password via the Buildkite secrets plugin; the
# only Buildkite secret is OP_SERVICE_ACCOUNT_TOKEN, and the coreplane-bot
# GitHub App token handles release-please and GHCR access.
---
steps:
  - label: ":rocket: release-please"
    command: .buildkite/steps/release-please.sh
    plugins:
      - secrets#v2.4.0:
          variables:
            OP_SERVICE_ACCOUNT_TOKEN: OP_SERVICE_ACCOUNT_TOKEN
    agents:
      queue: linux-large
