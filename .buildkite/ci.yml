# Buildkite port of .github/workflows/ci.yaml.
#
# GitHub Actions triggered this on pull_request, merge_group,
# workflow_dispatch, and push to main; in Buildkite the equivalent
# triggers live in the pipeline's settings (build PRs + build branches),
# so this file only describes the work. Hermit pins the toolchain exactly
# as it does locally and in GitHub Actions (via cashapp/activate-hermit),
# so the hosted agent needs nothing preinstalled but Docker (for the kind
# e2e) and Git. Each step uses a dedicated hosted-agent cache volume for
# Hermit, Go, golangci-lint, and Docker build caches.
---
env:
  CI: "true"

steps:
  - label: ":white_check_mark: do"
    key: do
    command: .buildkite/steps/do.sh
    cache:
      name: "polylane-do-cache"
      size: "40g"
      paths:
        - ".cache"
    agents:
      queue: linux-large

  - label: ":kubernetes: e2e"
    key: e2e
    # Hosted agents ship a working Docker daemon, which kind needs. They
    # also default the active buildx builder to a remote one whose output
    # only lands in the build cache, so a plain `docker build -t x` (as the
    # e2e harness runs) never reaches the local image store and `kind load
    # docker-image` can't find it. Selecting the `default` (docker-driver)
    # builder makes builds load into the daemon like they do locally.
    command: .buildkite/steps/e2e.sh
    cache:
      name: "polylane-e2e-cache"
      size: "40g"
      paths:
        - ".cache"
    agents:
      queue: linux-large
