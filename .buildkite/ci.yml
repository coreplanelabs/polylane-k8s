# Buildkite port of .github/workflows/ci.yaml.
#
# GitHub Actions triggered this on pull_request, merge_group,
# workflow_dispatch, and push to main; in Buildkite the equivalent
# triggers live in the pipeline's settings (build PRs + build branches),
# so this file only describes the work. Hermit pins the toolchain exactly
# as it does locally and in GitHub Actions (via cashapp/activate-hermit),
# so the hosted agent needs nothing preinstalled but Docker (for the kind
# e2e) and Git.
---
env:
  CI: "true"

steps:
  - label: ":white_check_mark: do"
    key: do
    command:
      - source bin/activate-hermit
      - task do
      - task test:full
      - git diff --exit-code
    agents:
      queue: linux-large

  - label: ":kubernetes: e2e"
    key: e2e
    # ubuntu hosted agents ship a working Docker daemon, which kind needs.
    command:
      - source bin/activate-hermit
      - task e2e
    agents:
      queue: linux-large
