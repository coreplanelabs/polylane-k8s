---
# Vendored from cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
# (v1.1.5), with two deviations:
#   - the nested actions/cache reference is SHA-pinned (the repo enforces
#     sha_pinning_required, which resolves composite actions recursively,
#     and upstream has no release with a pinned cache action);
#   - inputs.working-directory reaches the shell via env, not template
#     expansion (zizmor: template-injection).
# Renovate maintains the pin below; drop this vendor copy if upstream ships
# a fully-pinned release.
name: 'Activate Hermit'
description: 'Activate a Hermit environment'
inputs:
  working-directory:
    description: 'The directory with the Hermit environment (contains `bin/hermit`)'
    required: false
    default: './'
  cache:
    description: 'If "true", installed Hermit packages will be cached.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - if: ${{ inputs.cache == 'true' }}
      id: bin-hash
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        hash="$(find "./${WORKING_DIRECTORY}/bin" ! -type d | sort | xargs openssl sha256 | openssl sha256 -r | cut -d' ' -f1)"
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
    - if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/hermit/pkg' || '~/.cache/hermit/pkg' }}
        key: ${{ runner.os }}-${{ runner.arch}}-hermit-cache-${{ steps.bin-hash.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch}}-hermit-cache-
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ./bin/hermit env --raw >> "$GITHUB_ENV"
