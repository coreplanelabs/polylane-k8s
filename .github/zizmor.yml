---
# zizmor configuration — enforced in CI via `task lint:workflows`.
rules:
  unpinned-tools:
    ignore:
      # 1password/load-secrets-action (itself SHA-pinned) fetches the op
      # CLI at its latest release. Accepted for now; the fix is moving the
      # release flow to a hermit-pinned `op`, which is planned as part of
      # the deferred Buildkite migration (see closed PR #3).
      - release.yaml
  github-env:
    ignore:
      # Exporting hermit's environment into GITHUB_ENV is the vendored
      # activate-hermit action's entire purpose. The content comes from
      # the repo's own bin/ (hermit-pinned toolchain), which anyone able
      # to influence could equally use to edit the workflows themselves —
      # no privilege boundary is crossed.
      - action.yml
