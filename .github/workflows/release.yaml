---
name: release-please

"on":
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Load Secrets from 1Password
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4.0.1
        with:
          # Automatically exports the loaded keys as environment variables
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # Syntax: op://<vault-name>/<item-name>/<field-name>
          COREPLANE_CLIENT_ID: op://CI/coreplane-bot/client-id
          COREPLANE_PRIVATE_SIGNING_KEY: op://CI/coreplane-bot/private-key

      - name: Generate a GitHub token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ env.COREPLANE_CLIENT_ID }}
          private-key: ${{ env.COREPLANE_PRIVATE_SIGNING_KEY }}
          owner: ${{ github.repository_owner }}
          # Scope the minted token to this repo and to exactly what
          # release-please needs — never the app installation's full grant.
          repositories: polylane-k8s
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          target-branch: ${{ github.ref_name }}

  # The Helm chart ships as an OCI artifact alongside the images.
  # Chart.yaml's version/appVersion are bumped by release-please in the
  # release commit itself, so packaging the tagged tree is all it takes.
  publish-chart:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # OIDC identity for cosign keyless signing.
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Activate Hermit
        uses: ./.github/actions/activate-hermit
        with:
          cache: "true"

      # helm and cosign keep separate credential stores (helm its own
      # registry config, cosign the Docker config), so log in to both —
      # otherwise the signing step 401s on the chart helm just pushed.
      - name: Log in to GHCR for Helm and cosign
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |-
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$OWNER" --password-stdin
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io --username "$OWNER" --password-stdin

      - name: Package, push, and sign chart
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        # Sign the digest helm push reports: like the image, the signature
        # binds to the manifest, not to a movable tag.
        run: |-
          helm package charts/polylane-k8s --destination dist/
          helm push "dist/polylane-k8s-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          test -n "$digest"
          cosign sign --yes "ghcr.io/${OWNER}/charts/polylane-k8s@${digest}"
