---
name: goreleaser

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # OIDC identity for cosign keyless signing (checksums.txt).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Activate Hermit
        uses: ./.github/actions/activate-hermit
        with:
          cache: "true"

      - name: Build and attach release binaries
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
