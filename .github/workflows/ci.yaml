---
name: ci

"on":
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CI: "true"

jobs:
  do:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Activate Hermit
        uses: ./.github/actions/activate-hermit
        with:
          cache: "true"

      - name: Run quality checks
        run: task do

      - name: Run full test suite with race detection
        run: task test:full

      - name: Verify generated files are committed
        run: git diff --exit-code

  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Activate Hermit
        uses: ./.github/actions/activate-hermit
        with:
          cache: "true"

      # ubuntu-24.04 runners ship a working Docker daemon, which kind needs.
      - name: Run end-to-end tests (kind cluster + fakeplatform)
        run: task e2e

  check:
    if: always()
    needs:
      - do
      - e2e
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
